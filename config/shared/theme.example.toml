# Shared Remya appearance preferences. System mode is read from GNOME/GTK.
version = 1

[theme]
# tonal_spot, fidelity, monochrome, neutral, vibrant, expressive,
# content, rainbow, fruit_salad
style_variant = "tonal_spot"
# Light or dark for Remya apps. Settings has a separate Apply to system action.
theme_mode = "light"
# standard, medium, high
contrast = "standard"

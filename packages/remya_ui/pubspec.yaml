name: remya_ui
description: Shared Flutter theme, identity and settings-window components for Remya applications.
publish_to: none
version: 0.1.0
environment:
  sdk: ^3.13.7
dependencies:
  flutter:
    sdk: flutter
  remya_client:
    path: ../remya_client
  croppy: ^1.5.3
  file_selector: ^1.1.0
  flex_color_picker: ^4.0.0
  material_ui: ^1.5.0
  material_color_utilities: ^0.13.0
dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
flutter:
  assets:
    - assets/ai_providers/
    - assets/licenses/lobe-icons.txt
    - assets/licenses/croppy-kiwi.txt

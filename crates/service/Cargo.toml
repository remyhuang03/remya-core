[package]
name = "remya_service"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "remyad"
path = "src/main.rs"

[dependencies]
remya_google_account = { path = "../google_account" }
remya_app_preferences = { path = "../app_preferences" }
gio = { version = "0.21.5", features = ["v2_84"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
xdg = "3"
tempfile = "3.23"
ureq = "3"
remya_appearance = { path = "../appearance" }
remya_date_time = { path = "../date_time" }
remya_display = { path = "../display" }
remya_system_information = { path = "../system_information" }
remya_background = { path = "../background" }
remya_fonts = { path = "../fonts" }
remya_default_apps = { path = "../default_apps" }
remya_applications = { path = "../applications" }
remya_network = { path = "../network" }
remya_bluetooth = { path = "../bluetooth" }

remya_sound = { path = "../sound" }
remya_updates = { path = "../updates" }

remya_camera = { path = "../camera" }

remya_power = { path = "../power" }

remya_startup = { path = "../startup" }
remya_storage = { path = "../storage" }
remya_input = { path = "../input" }
remya_printers = { path = "../printers" }
udev = "0.9.3"

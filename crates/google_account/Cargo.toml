[package]
name = "remya_google_account"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
base64 = "0.23"
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
form_urlencoded = "1"
getrandom = "0.4"
gio = { version = "0.21.5", features = ["v2_84"] }
httparse = "1"
percent-encoding = "2"
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3.23"
ureq = "3"

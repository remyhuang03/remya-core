[package]
name = "remya_camera"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[features]
preview = ["dep:gstreamer", "dep:gstreamer-app", "dep:gstreamer-video"]

[dependencies]
pipewire = "0.10.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
remya_display = { path = "../display" }
gstreamer = { version = "0.25", features = ["v1_28"], optional = true }
gstreamer-app = { version = "0.25", features = ["v1_28"], optional = true }
gstreamer-video = { version = "0.25", features = ["v1_28"], optional = true }

[dev-dependencies]
tempfile = "3.23"

[[example]]
name = "preview"
required-features = ["preview"]
